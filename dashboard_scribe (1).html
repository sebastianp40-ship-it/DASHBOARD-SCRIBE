<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCRIBE · Dashboard comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --magenta:#E3256B; --ceruleo:#1CA9C9; --violeta:#7B57A8; --verde:#1F9E7A; --naranja:#FF8A3D;
  --ink:#101820; --bg:#E9ECF0; --card:#FFFFFF;
  --muted:#5C6672; --line:#DCE1E8; --soft:#F3F5F8;
  --pos:#1F9E7A; --neg:#E3256B;
  --disp:'Archivo','Archivo Black','Helvetica Neue',Arial,sans-serif;
  --body:'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'IBM Plex Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- cabecera ---------- */
.stripe{height:7px;display:flex}
.stripe i{flex:1}
.stripe i:nth-child(1){background:var(--magenta)}
.stripe i:nth-child(2){background:var(--ceruleo)}
.stripe i:nth-child(3){background:var(--violeta)}
.stripe i:nth-child(4){background:var(--verde)}
.stripe i:nth-child(5){background:var(--naranja)}
header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 1px 10px rgba(16,24,32,.06)}
.hrow{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:12px 22px 10px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;line-height:1}
.brand .sub{font-size:12px;color:var(--muted);letter-spacing:.02em}
.cut{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 11px;white-space:nowrap}
.filters{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
select{font-family:var(--body);font-size:12.5px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 26px 6px 10px;min-width:150px;
  appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0h10L5 6z' fill='%235C6672'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;cursor:pointer}
select:focus-visible,button:focus-visible{outline:2px solid var(--ceruleo);outline-offset:2px}
select:disabled{opacity:.42;cursor:not-allowed}
.fld.off label{opacity:.5}
nav{display:flex;gap:2px;padding:0 16px;overflow-x:auto}
nav button{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--magenta)}

/* ---------- layout ---------- */
main{padding:20px 22px 60px;max-width:1560px;margin:0 auto}
.panel{display:none}
.panel.on{display:block}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.35fr 1fr}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card h2{font-family:var(--disp);font-weight:700;font-size:14.5px;letter-spacing:-.01em;margin:0 0 2px}
.card .hint{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.chead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.chead .hint{margin:0}

/* ---------- kpi ---------- */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px 15px;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k,var(--magenta))}
.kpi .lab{font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--disp);font-weight:700;font-size:27px;letter-spacing:-.02em;line-height:1.12;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.kpi .foot{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.chip.up{background:rgba(31,158,122,.12);color:#177A5E}
.chip.dn{background:rgba(227,37,107,.11);color:#C01B58}
.chip.nt{background:var(--soft);color:var(--muted)}

/* ---------- tablas ---------- */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
td{padding:6px 8px;border-bottom:1px solid var(--soft);text-align:right;white-space:nowrap}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--soft)}
tbody tr:last-child td{border-bottom:0}
tr.tot td{border-top:1.5px solid var(--line);font-weight:700;background:var(--soft)}
td.name{white-space:normal;line-height:1.25;max-width:280px}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:1px}
.mini{font-size:10.5px;color:var(--muted)}
.pill{font-size:10px;font-weight:600;background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}
.bar-cell{position:relative}
.bar-cell i{position:absolute;left:8px;top:50%;transform:translateY(-50%);height:7px;border-radius:2px;opacity:.28}
.bar-cell span{position:relative}

/* ---------- controles ---------- */
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--soft)}
.seg button{font-family:var(--body);font-size:11.5px;font-weight:600;color:var(--muted);background:none;border:0;padding:6px 12px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,32,.12)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--body)}
svg text.n{font-family:var(--mono)}
.mline{stroke:var(--line);stroke-width:1}
.empty{color:var(--muted);font-size:12.5px;padding:14px 2px}

/* ---------- responsive ---------- */
@media (max-width:1180px){ .g4{grid-template-columns:repeat(2,1fr)} .g23{grid-template-columns:1fr} }
@media (max-width:900px){ .g3,.g2{grid-template-columns:1fr} main{padding:16px 12px 50px} .hrow{padding:12px 14px 10px} .filters{margin-left:0;width:100%} select{min-width:0;width:100%} .fld{flex:1} }
@media (max-width:560px){ .g4{grid-template-columns:1fr} .brand h1{font-size:22px} }

/* ---------- impresión ---------- */
@media print{
  body{background:#fff}
  header{position:static;box-shadow:none}
  nav,.filters{display:none}
  .panel{display:block!important;page-break-before:always}
  .panel:first-of-type{page-break-before:auto}
  .card{break-inside:avoid;box-shadow:none}
  .panel::before{content:attr(data-title);display:block;font-family:var(--disp);font-weight:700;font-size:18px;margin:8px 0 12px}
}
</style>
</head>

<script>

/* ============ datos ============ */
const RAW = JSON.parse(document.getElementById('DATA').textContent);
const dec = s => s.split(',').map(v => parseInt(v, 36));
const CAT = RAW.cat, CLI = RAW.cli, CAN = RAW.can, ZON = RAW.zon, VEN = RAW.ven, PN = RAW.pn, PC = RAW.pc;
const PAL = ['#E3256B', '#1CA9C9', '#7B57A8', '#FF8A3D', '#1F9E7A'];
const CATC = RAW.catc || [];
const catColor = i => CATC[i] || PAL[i % PAL.length];   // color fijo por categoría

const _d = dec(RAW.D);
const N = RAW.n;
const R = {
  di: new Int32Array(N), c: dec(RAW.C), p: dec(RAW.P), k: dec(RAW.K),
  z: dec(RAW.Z), v: dec(RAW.V), f: dec(RAW.F), n: dec(RAW.N), r: dec(RAW.R), u: dec(RAW.U),
  y: new Int16Array(N), m: new Int8Array(N), dd: new Int8Array(N), cat: new Int8Array(N)
};
const BASE = Date.parse(RAW.base + 'T00:00:00Z');   // UTC: el cambio de hora no debe correr fechas
let acc = 0;
for (let i = 0; i < N; i++) {
  acc += _d[i]; R.di[i] = acc;
  const dt = new Date(BASE + acc * 86400000);
  R.y[i] = dt.getUTCFullYear(); R.m[i] = dt.getUTCMonth(); R.dd[i] = dt.getUTCDate();
  R.cat[i] = PC[R.p[i]];
}
const CUT = new Date(Date.parse(RAW.cut + 'T00:00:00Z'));
const CY = CUT.getUTCFullYear(), PY = CY - 1, CM = CUT.getUTCMonth(), CD = CUT.getUTCDate();
const LASTDAY = new Date(CY, CM + 1, 0).getDate();
const PARTIAL = CD < LASTDAY;
const MES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
const MESL = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const YEARS = [...new Set(Array.from(R.y))].sort();

/* ============ formato chileno ============ */
const nf = (v, d = 0) => (isFinite(v) ? v : 0).toLocaleString('es-CL', { minimumFractionDigits: d, maximumFractionDigits: d });
function money(v) {
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e6) return s + '$' + nf(a / 1e6, a / 1e6 >= 100 ? 0 : 1) + ' MM';
  if (a >= 1e4) return s + '$' + nf(a / 1e3, 0) + ' M';
  if (a >= 1000) return s + '$' + nf(a / 1e3, 1) + ' M';
  return s + '$' + nf(a, 0);
}
const money0 = v => (v < 0 ? '-' : '') + '$' + nf(Math.abs(v), 0);
const pct = (v, d = 1) => (v > 0 ? '+' : '') + nf(v, d) + '%';
const pct0 = (v, d = 1) => nf(v, d) + '%';
function yoy(cur, prev) {
  if (prev < 0) return { t: '—', c: 'nt', v: null };                      // base negativa: no comparable
  if (!prev) return cur > 0 ? { t: 'nuevo', c: 'nt', v: null } : { t: '—', c: 'nt', v: null };
  const v = (cur / prev - 1) * 100;
  return { t: pct(v), c: v >= 0 ? 'up' : 'dn', v };
}
const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const ymKey = (y, m) => y * 12 + m;

/* ============ filtros y agregación ============ */
const F = { canal: -1, zona: -1, mes: null };
let IDX = [];
function applyFilter() {
  IDX = [];
  for (let i = 0; i < N; i++) {
    if (F.canal >= 0 && R.k[i] !== F.canal) continue;
    if (F.zona >= 0 && R.z[i] !== F.zona) continue;
    IDX.push(i);
  }
}
const inYtd = i => (R.m[i] < CM) || (R.m[i] === CM && R.dd[i] <= CD);   // tramo comparable a la fecha de corte
const isCur = i => R.y[i] === CY, isPrev = i => R.y[i] === PY;

function sum(pred, field) { let s = 0; for (const i of IDX) if (pred(i)) s += R[field][i]; return s; }
function uniq(pred, field) { const s = new Set(); for (const i of IDX) if (pred(i)) s.add(R[field][i]); return s.size; }

function group(pred, keyFn) {
  const m = new Map();
  for (const i of IDX) {
    if (!pred(i)) continue;
    const k = keyFn(i);
    if (k === null || k === undefined) continue;
    let o = m.get(k);
    if (!o) { o = { k, n: 0, u: 0, f: new Set(), c: new Set(), last: -1 }; m.set(k, o); }
    o.n += R.n[i]; o.u += R.u[i]; o.f.add(R.f[i]); o.c.add(R.c[i]);
    if (R.di[i] > o.last) o.last = R.di[i];
  }
  return m;
}
const byVal = (a, b) => b.n - a.n;
const dstr = di => { const d = new Date(BASE + di * 86400000); return String(d.getUTCDate()).padStart(2, '0') + '-' + MES[d.getUTCMonth()] + '-' + String(d.getUTCFullYear()).slice(2); };

/* meses con movimiento (orden ascendente) */
function monthsWithData() {
  const s = new Set();
  for (let i = 0; i < N; i++) s.add(ymKey(R.y[i], R.m[i]));
  return [...s].sort((a, b) => a - b);
}
const ALLM = monthsWithData();

/* ============ helpers SVG ============ */
const SVG = (vb, inner, extra = '') => `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet" ${extra}>${inner}</svg>`;
const T = t => `<title>${esc(t)}</title>`;
function txt(x, y, s, o = {}) {
  return `<text x="${x}" y="${y}" fill="${o.fill || 'var(--muted)'}" font-size="${o.size || 10}" font-weight="${o.w || 500}"
    text-anchor="${o.a || 'start'}" class="${o.mono ? 'n' : ''}" ${o.ls ? `letter-spacing="${o.ls}"` : ''}>${esc(s)}</text>`;
}
let _cv;
function textW(s, font) {
  if (!_cv) _cv = document.createElement('canvas').getContext('2d');
  _cv.font = font; return _cv.measureText(s).width;
}
function niceMax(v) {
  if (v <= 0) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e;
  return (f <= 1.2 ? 1.2 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 4 ? 4 : f <= 5 ? 5 : f <= 8 ? 8 : 10) * e;
}
function axisTicks(max, n = 4) { const out = []; for (let i = 0; i <= n; i++) out.push(max * i / n); return out; }
function shortMoney(v) {
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e6) return s + nf(a / 1e6, a / 1e6 >= 100 ? 0 : 1) + ' MM';
  if (a >= 1e3) return s + nf(a / 1e3, 0) + ' M';
  return s + nf(a, 0);
}
function mix(hex, w) { // hex sobre blanco, w = 0..1 intensidad
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const f = c => Math.round(255 + (c - 255) * w);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
const kpi = (label, val, foot, color) =>
  `<div class="kpi" style="--k:${color}"><div class="lab">${esc(label)}</div><div class="val">${val}</div><div class="foot">${foot}</div></div>`;
const chip = o => `<span class="chip ${o.c}">${esc(o.t)}</span>`;

/* ============ barras agrupadas por mes (2 años) ============ */
function monthBars(seriesPrev, seriesCur, opt = {}) {
  const W = 1000, H = opt.h || 300, ml = 54, mr = 12, mt = 16, mb = 30;
  const iw = W - ml - mr, ih = H - mt - mb;
  const max = niceMax(Math.max(...seriesPrev, ...seriesCur, 1));
  const cw = iw / 12, bw = Math.min(22, cw * .32), gap = 4;
  let s = '';
  axisTicks(max).forEach(t => {
    const y = mt + ih - (t / max) * ih;
    s += `<line x1="${ml}" x2="${W - mr}" y1="${y}" y2="${y}" class="mline" ${t === 0 ? '' : 'stroke-dasharray="2 4"'}/>`;
    s += txt(ml - 8, y + 3.5, opt.unit === 'u' ? nf(t) : shortMoney(t), { a: 'end', size: 9.5, mono: 1 });
  });
  for (let m = 0; m < 12; m++) {
    const cx = ml + cw * m + cw / 2;
    const vs = [{ v: seriesPrev[m], c: '#B9C2CD', y: PY }, { v: seriesCur[m], c: opt.color || 'var(--magenta)', y: CY }];
    vs.forEach((o, j) => {
      if (!o.v || o.v <= 0) return;
      const h = Math.max(1, (o.v / max) * ih), x = cx - bw - gap / 2 + j * (bw + gap);
      s += `<rect x="${x}" y="${mt + ih - h}" width="${bw}" height="${h}" rx="2.5" fill="${o.c}">${T(`${MESL[m]} ${o.y} · ${opt.unit === 'u' ? nf(o.v) + ' un' : money0(o.v)}`)}</rect>`;
    });
    s += txt(cx, H - 10, MES[m], { a: 'middle', size: 10, fill: 'var(--muted)' });
  }
  return SVG(`0 0 ${W} ${H}`, s, `style="max-height:${H}px"`);
}

/* ============ waterfall YoY ============ */
function waterfall(prevTot, deltas, curTot) {
  const W = 1000, H = 320, ml = 8, mr = 8, mt = 34, mb = 46;
  const ih = H - mt - mb, n = deltas.length + 2, cw = (W - ml - mr) / n, bw = Math.min(78, cw * .6);
  let run = prevTot, lo = Math.min(0, prevTot, curTot), hi = Math.max(prevTot, curTot);
  deltas.forEach(d => { const a = run, b = run + d.v; lo = Math.min(lo, a, b); hi = Math.max(hi, a, b); run = b; });
  const max = niceMax(hi * 1.08), min = lo < 0 ? -niceMax(-lo * 1.15) : 0;
  const sy = v => mt + ih - ((v - min) / (max - min)) * ih;
  let s = `<line x1="${ml}" x2="${W - mr}" y1="${sy(0)}" y2="${sy(0)}" class="mline"/>`;
  run = prevTot;
  const bars = [{ lab: `YTD ${PY}`, v: prevTot, type: 'tot', c: '#8A95A3' }]
    .concat(deltas.map(d => ({ lab: d.lab, v: d.v, type: 'd', c: d.c })))
    .concat([{ lab: `YTD ${CY}`, v: curTot, type: 'tot', c: 'var(--magenta)' }]);
  let cursor = 0;
  bars.forEach((b, i) => {
    const cx = ml + cw * i + cw / 2, x = cx - bw / 2;
    let y0, y1, val = b.v, tip;
    if (b.type === 'tot') { y0 = sy(0); y1 = sy(b.v); cursor = b.v; tip = `${b.lab}: ${money0(b.v)}`; }
    else { const from = cursor, to = cursor + b.v; y0 = sy(from); y1 = sy(to); cursor = to; tip = `${b.lab}: ${b.v >= 0 ? '+' : ''}${money0(b.v)}`; }
    const top = Math.min(y0, y1), h = Math.max(1.5, Math.abs(y1 - y0));
    const fill = b.type === 'tot' ? b.c : b.c;
    const op = b.type === 'tot' ? 1 : (b.v >= 0 ? .95 : .45);
    s += `<rect x="${x}" y="${top}" width="${bw}" height="${h}" rx="2.5" fill="${fill}" opacity="${op}">${T(tip)}</rect>`;
    if (b.type !== 'tot' && b.v < 0) s += `<rect x="${x}" y="${top}" width="${bw}" height="${h}" rx="2.5" fill="none" stroke="${fill}" stroke-width="1.4" stroke-dasharray="3 2.5"/>`;
    const lv = b.type === 'tot' ? shortMoney(b.v) : (b.v >= 0 ? '+' : '') + shortMoney(b.v);
    s += txt(cx, top - 7, lv, { a: 'middle', size: 10.5, w: 600, mono: 1, fill: b.type === 'tot' ? 'var(--ink)' : (b.v >= 0 ? 'var(--pos)' : 'var(--neg)') });
    const words = b.lab.split(' ');
    let lines = [b.lab];
    if (b.lab.length > 13) { const h2 = Math.ceil(words.length / 2); lines = [words.slice(0, h2).join(' '), words.slice(h2).join(' ')]; }
    lines.forEach((L, li) => s += txt(cx, H - mb + 18 + li * 11, L, { a: 'middle', size: 9.8, w: 600, fill: 'var(--ink)' }));
    if (i < bars.length - 1) { const nx = ml + cw * (i + 1) + cw / 2 - bw / 2; s += `<line x1="${x + bw}" x2="${nx}" y1="${sy(cursor)}" y2="${sy(cursor)}" stroke="#C6CEDA" stroke-width="1" stroke-dasharray="3 3"/>`; }
  });
  return SVG(`0 0 ${W} ${H}`, s);
}

/* ============ heatmap ============ */
function heatmap(view) {
  const rows = [], W = 1000, lw = 168, cellH = 30, gap = 3;
  const months = Array.from({ length: 12 }, (_, m) => m);
  if (view === 'cli') {
    const tot = group(i => isCur(i), i => R.c[i]);
    const top = [...tot.values()].sort(byVal).slice(0, 10);
    top.forEach(o => {
      const vals = months.map(m => { let s = 0; for (const i of IDX) if (isCur(i) && R.m[i] === m && R.c[i] === o.k) s += R.n[i]; return s; });
      rows.push({ lab: CLI[o.k], vals, color: 'var(--ceruleo)', hex: '#1CA9C9' });
    });
  } else {
    CAT.forEach((c, ci) => {
      const cur = months.map(m => { let s = 0; for (const i of IDX) if (isCur(i) && R.m[i] === m && R.cat[i] === ci) s += R.n[i]; return s; });
      const prv = months.map(m => { let s = 0; for (const i of IDX) if (isPrev(i) && R.m[i] === m && R.cat[i] === ci) s += R.n[i]; return s; });
      rows.push({ lab: c, vals: cur, prev: prv, hex: catColor(ci) });
    });
  }
  const H = 26 + rows.length * (cellH + gap) + 6;
  const cw = (W - lw) / 12;
  let s = '';
  months.forEach(m => s += txt(lw + cw * m + cw / 2, 15, MES[m], { a: 'middle', size: 9.5, w: 600, fill: 'var(--muted)' }));
  const maxAll = Math.max(1, ...rows.flatMap(r => r.vals.map(Math.abs)));
  rows.forEach((r, ri) => {
    const y = 26 + ri * (cellH + gap);
    const lab = r.lab.length > 26 ? r.lab.slice(0, 25) + '…' : r.lab;
    s += `<text x="0" y="${y + cellH / 2 + 3.5}" font-size="10.5" font-weight="600" fill="var(--ink)">${esc(lab)}<title>${esc(r.lab)}</title></text>`;
    months.forEach(m => {
      const x = lw + cw * m + 1.5, w = cw - 3, v = r.vals[m];
      let fill = 'var(--soft)', label = '', tip = '', tcol = 'var(--ink)';
      if (view === 'var') {
        const p = r.prev[m];
        if (!v && !p) { fill = '#F3F5F8'; tip = `${r.lab} · ${MESL[m]}: sin venta`; }
        else if (!p) { fill = mix('#1F9E7A', .3); label = 'nuevo'; tip = `${r.lab} · ${MESL[m]}: ${money0(v)} (sin base ${PY})`; }
        else {
          const d = (v / p - 1) * 100, k = Math.min(1, Math.abs(d) / 100);
          fill = mix(d >= 0 ? '#1F9E7A' : '#E3256B', .18 + k * .72);
          label = pct(d, 0); tcol = k > .55 ? '#fff' : 'var(--ink)';
          tip = `${r.lab} · ${MESL[m]}: ${money0(v)} vs ${money0(p)} (${pct(d)})`;
        }
      } else {
        if (v > 0) { const k = Math.abs(v) / maxAll; fill = mix(r.hex, .12 + Math.pow(k, .55) * .82); label = shortMoney(v); tcol = k > .45 ? '#fff' : 'var(--ink)'; }
        else if (v < 0) { fill = mix('#E3256B', .5); label = shortMoney(v); tcol = '#fff'; }
        tip = `${r.lab} · ${MESL[m]} ${CY}: ${v ? money0(v) : 'sin venta'}`;
      }
      s += `<rect x="${x}" y="${y}" width="${w}" height="${cellH}" rx="4" fill="${fill}">${T(tip)}</rect>`;
      if (label) s += `<text x="${x + w / 2}" y="${y + cellH / 2 + 3.5}" font-size="9.5" font-weight="600" text-anchor="middle" fill="${tcol}" class="n" pointer-events="none">${esc(label)}</text>`;
    });
  });
  return SVG(`0 0 ${W} ${H}`, s);
}

/* ============ tablas genéricas ============ */
function tbl(head, rows, opt = {}) {
  const th = head.map(h => `<th class="${h.l ? 'l' : ''}">${esc(h.t)}</th>`).join('');
  const tr = rows.map(r => `<tr>${r.map(c => typeof c === 'object' ? `<td class="${c.cls || ''}">${c.h}</td>` : `<td>${c}</td>`).join('')}</tr>`).join('');
  return `<div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${tr}${opt.foot || ''}</tbody></table></div>`;
}
const cN = h => ({ h, cls: 'n' });
const cL = (h, cls) => ({ h, cls: 'l ' + (cls || '') });

/* ============ 1 · RESUMEN ============ */
function renderResumen() {
  const mtdC = sum(i => isCur(i) && R.m[i] === CM && R.dd[i] <= CD, 'n');

  const pmC = unC ? ytdC / unC : 0, pmP = unP ? ytdP / unP : 0;

  </div>`;

  const sC = Array(12).fill(0), sP = Array(12).fill(0);
  for (const i of IDX) { if (isCur(i)) sC[R.m[i]] += R.n[i]; else if (isPrev(i)) sP[R.m[i]] += R.n[i]; }

  const wf = `<div class="card"><h2>Puente de variación YoY</h2>

  const hm = `<div class="card"><div class="chead"><div><h2>Mapa de calor</h2><p class="hint" id="hmHint"></p></div>

const share = (list, n, tot) => tot ? list.slice(0, n).reduce((a, o) => a + o.n, 0) / tot * 100 : 0;

function crayonChart() {
  const W = 1000, rowH = 34, gap = 16, tip = 17, padR = 236, labFont = '600 12px Inter, sans-serif';
  const data = CAT.map((c, ci) => {
    const n = sum(i => isCur(i) && inYtd(i) && R.cat[i] === ci, 'n');
    const u = sum(i => isCur(i) && inYtd(i) && R.cat[i] === ci, 'u');
    const p = sum(i => isPrev(i) && inYtd(i) && R.cat[i] === ci, 'n');
    const sk = uniq(i => isCur(i) && inYtd(i) && R.cat[i] === ci, 'p');
    return { lab: c, n, u, p, sk, hex: catColor(ci) };
  }).filter(o => o.n > 0 || o.u !== 0).sort((a, b) => b.n - a.n);
  if (!data.length) return '<p class="empty">Sin venta en el período filtrado.</p>';
  const maxV = Math.max(...data.map(o => Math.max(0, o.n)), 1);
  const maxL = W - tip - padR;
  const minL = o => textW(o.lab, labFont) + 30 + 40;          // banda de papel + cuerpo mínimo
  const H = data.length * rowH + (data.length - 1) * gap + 8;
  let s = '';
  data.forEach((o, ri) => {
    const y = ri * (rowH + gap), yc = y + rowH / 2;
    const L = Math.max(minL(o), Math.min(maxL, (Math.max(0, o.n) / maxV) * maxL));
    const dark = o.hex;
    s += `<g>${T(`${o.lab}: ${money0(o.n)} · ${nf(o.u)} un · ${o.sk} SKU`)}`;
    s += `<rect x="0" y="${y}" width="${L}" height="${rowH}" rx="7" fill="${dark}"/>`;
    s += `<rect x="0" y="${y}" width="${L}" height="${rowH * .34}" rx="7" fill="#fff" opacity=".18"/>`;
    s += `<polygon points="${L},${y} ${L + tip},${yc} ${L},${y + rowH}" fill="${dark}"/>`;
    s += `<polygon points="${L},${y} ${L + tip},${yc} ${L},${yc}" fill="#fff" opacity=".16"/>`;
    const bw = textW(o.lab, labFont) + 30, bx = Math.max(6, (L - bw) / 2);
    s += `<rect x="${bx}" y="${y - 1.5}" width="${bw}" height="${rowH + 3}" rx="3" fill="#FFFFFF" opacity=".93"/>`;
    s += `<rect x="${bx}" y="${y - 1.5}" width="2" height="${rowH + 3}" fill="${dark}" opacity=".35"/>`;
    s += `<rect x="${bx + bw - 2}" y="${y - 1.5}" width="2" height="${rowH + 3}" fill="${dark}" opacity=".35"/>`;
    s += `<text x="${bx + bw / 2}" y="${yc + 4.2}" text-anchor="middle" font-size="12" font-weight="600" fill="${dark}">${esc(o.lab)}</text>`;
    s += `</g>`;
    const xr = L + tip + 14, yv = yoy(o.n, o.p);
    s += `<text x="${xr}" y="${yc - 2}" font-size="13" font-weight="700" fill="var(--ink)" class="n">${esc(shortMoney(o.n))}</text>`;
    s += `<text x="${xr}" y="${yc + 12.5}" font-size="10.5" fill="var(--muted)" class="n">${esc(nf(o.u) + ' un · ' + o.sk + ' SKU · ' + yv.t)}</text>`;
  });
  return SVG(`0 0 ${W} ${H}`, s);
}
function paretoChart(list, tot) {
  const W = 1000, H = 300, ml = 52, mr = 46, mt = 18, mb = 26, iw = W - ml - mr, ih = H - mt - mb;
  if (!list.length || !tot) return '<p class="empty">Sin venta en el período filtrado.</p>';
  const n = list.length, cw = iw / n, max = niceMax(list[0].n);
  let s = '', cum = 0, pts = [];
  axisTicks(max).forEach(t => {
    const y = mt + ih - t / max * ih;
    s += `<line x1="${ml}" x2="${W - mr}" y1="${y}" y2="${y}" class="mline" ${t === 0 ? '' : 'stroke-dasharray="2 4"'}/>` +
      txt(ml - 7, y + 3.5, shortMoney(t), { a: 'end', size: 9, mono: 1 });
  });
  [0, 50, 80, 100].forEach(p => {
    const y = mt + ih - p / 100 * ih;
    if (p === 80) s += `<line x1="${ml}" x2="${W - mr}" y1="${y}" y2="${y}" stroke="var(--naranja)" stroke-width="1" stroke-dasharray="5 3"/>`;
    s += txt(W - mr + 7, y + 3.5, p + '%', { a: 'start', size: 9, mono: 1, fill: p === 80 ? 'var(--naranja)' : 'var(--muted)' });
  });
  list.forEach((o, i) => {
    const x = ml + cw * i, h = Math.max(1, o.n / max * ih);
    s += `<rect x="${x + cw * .12}" y="${mt + ih - h}" width="${cw * .76}" height="${h}" fill="${catColor(PC[o.k])}" opacity=".85">${T(`${PN[o.k]}: ${money0(o.n)}`)}</rect>`;
    cum += o.n; pts.push([x + cw / 2, mt + ih - (cum / tot) * ih]);
  });
  s += `<polyline points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => { if (i % 5 === 0 || i === pts.length - 1) s += `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="var(--ink)">${T(`${i + 1} SKU acumulan ${pct0((list.slice(0, i + 1).reduce((a, o) => a + o.n, 0)) / tot * 100)}`)}</circle>`; });
  s += txt(ml, H - 8, `SKU ordenados por venta (1 → ${n})`, { size: 9.5 });
  return SVG(`0 0 ${W} ${H}`, s);
}

function donut(items) {
  const W = 420, H = 220, cx = 118, cy = 110, r = 82, ir = 50;
  const tot = items.reduce((a, o) => a + Math.max(0, o.v), 0);
  if (!tot) return '<p class="empty">Sin venta en el período filtrado.</p>';
  let a0 = -Math.PI / 2, s = '';
  items.forEach((o, i) => {
    const v = Math.max(0, o.v); if (!v) return;
    const a1 = a0 + v / tot * Math.PI * 2, big = a1 - a0 > Math.PI ? 1 : 0;
    const p = (rr, a) => [cx + rr * Math.cos(a), cy + rr * Math.sin(a)];
    const [x0, y0] = p(r, a0), [x1, y1] = p(r, a1), [x2, y2] = p(ir, a1), [x3, y3] = p(ir, a0);
    s += `<path d="M${x0} ${y0} A${r} ${r} 0 ${big} 1 ${x1} ${y1} L${x2} ${y2} A${ir} ${ir} 0 ${big} 0 ${x3} ${y3} Z" fill="${PAL[i % 5]}" stroke="#fff" stroke-width="1.5">${T(`${o.lab}: ${money0(v)} · ${pct0(v / tot * 100)}`)}</path>`;
    a0 = a1;
  });
  s += `<text x="${cx}" y="${cy - 4}" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)" class="n">${esc(shortMoney(tot))}</text>`;
  s += `<text x="${cx}" y="${cy + 13}" text-anchor="middle" font-size="9.5" fill="var(--muted)">venta neta</text>`;
  items.slice(0, 6).forEach((o, i) => {
    const y = 34 + i * 26;
    s += `<rect x="238" y="${y - 9}" width="11" height="11" rx="3" fill="${PAL[i % 5]}"/>`;
    s += `<text x="256" y="${y}" font-size="11" font-weight="600" fill="var(--ink)">${esc(o.lab.length > 20 ? o.lab.slice(0, 19) + '…' : o.lab)}</text>`;
    s += `<text x="256" y="${y + 12}" font-size="9.5" fill="var(--muted)" class="n">${esc(shortMoney(o.v))} · ${pct0(o.v / tot * 100)}</text>`;
  });
  return SVG(`0 0 ${W} ${H}`, s, 'style="max-height:230px;margin-bottom:8px"');
}

function mAgg(k) {

  return o;
}

function trail13(k) {
  const ks = []; for (let i = 12; i >= 0; i--) ks.push(k - i);
  const vals = ks.map(kk => mAgg(kk).n);
  const W = 1000, H = 260, ml = 56, mr = 10, mt = 26, mb = 34, iw = W - ml - mr, ih = H - mt - mb;
  const max = niceMax(Math.max(...vals, 1)), cw = iw / 13, bw = Math.min(46, cw * .6);
  let s = '';
  axisTicks(max).forEach(t => { const y = mt + ih - t / max * ih;
    s += `<line x1="${ml}" x2="${W - mr}" y1="${y}" y2="${y}" class="mline" ${t === 0 ? '' : 'stroke-dasharray="2 4"'}/>` + txt(ml - 8, y + 3.5, shortMoney(t), { a: 'end', size: 9.5, mono: 1 }); });
  ks.forEach((kk, i) => {
    const yy = Math.floor(kk / 12), mm = kk % 12, v = vals[i], cx = ml + cw * i + cw / 2;
    const on = kk === k, h = Math.max(v > 0 ? 2 : 0, v / max * ih);

    if (on && v > 0) s += txt(cx, mt + ih - h - 7, shortMoney(v), { a: 'middle', size: 10, w: 700, mono: 1, fill: 'var(--magenta)' });
    s += txt(cx, H - 16, MES[mm], { a: 'middle', size: 9.5, w: on ? 700 : 500, fill: on ? 'var(--ink)' : 'var(--muted)' });
    if (mm === 0 || i === 0) s += txt(cx, H - 5, String(yy), { a: 'middle', size: 9, mono: 1 });

  return SVG(`0 0 ${W} ${H}`, s);
}

/* ============ 7 · ROTACIÓN Y STOCK ============ */
/* El stock es la última existencia registrada por SKU en la base, no una serie histórica,
   así que esta pestaña tampoco responde a los filtros de canal y zona. */
const PSTK = RAW.ps || [], PCST = RAW.px || [];
const CUTDI = Math.round((Date.parse(RAW.cut + 'T00:00:00Z') - BASE) / 86400000);
const PERIODOS = [
  { k: '12m', lab: 'Últimos 12 meses', dias: 365 },
  { k: '6m', lab: 'Últimos 6 meses', dias: 182 },
  { k: '3m', lab: 'Últimos 3 meses', dias: 91 },
  { k: 'y', lab: `Año ${CY}`, dias: null }
];
let PER = '12m';

const mesLab = k => MESL[k % 12][0].toUpperCase() + MESL[k % 12].slice(1) + ' ' + Math.floor(k / 12);

/* test  = lo vendido dentro del período (el numerador de la rotación)
   desde = lo vendido entre el inicio del período y la fecha de corte; sumado al stock
           actual reconstruye el stock inicial de ese período. En las ventanas que
           terminan hoy ambos coinciden; en un mes pasado, no. */
function perInfo() {
  if (PER.indexOf('m:') === 0) {
    const k = +PER.slice(2), y = Math.floor(k / 12), m = k % 12;
    const d0 = Math.round((Date.UTC(y, m, 1) - BASE) / 86400000);
    return { p: { k: PER, lab: mesLab(k), mes: true },
      test: i => R.y[i] === y && R.m[i] === m, desde: i => R.di[i] >= d0 };
  }
  const p = PERIODOS.find(x => x.k === PER) || PERIODOS[0];
  if (p.dias) { const t = i => R.di[i] > CUTDI - p.dias; return { p, test: t, desde: t }; }
  const t = i => R.y[i] === CY;
  return { p, test: t, desde: t };
}

/* unidades vendidas por SKU en el período, sin filtros de canal ni zona */
function unidadesPeriodo(test) {
  const u = new Float64Array(PN.length);
  for (let i = 0; i < N; i++) if (test(i)) u[R.p[i]] += R.u[i];
  return u;
}

function renderRotacion() {
  const sel = `<div class="card" style="display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px">
    <div><h2 style="margin:0">Rotación y stock</h2>
      <p class="hint" style="margin:2px 0 0">Cuánto de lo que había disponible se vendió. Stock inicial = stock actual + vendido en el período.</p></div>
    <div class="fld" style="margin-left:auto"><label for="perSel">Período</label><select id="perSel">
      <optgroup label="Acumulado">${PERIODOS.map(p => `<option value="${p.k}" ${p.k === PER ? 'selected' : ''}>${esc(p.lab)}</option>`).join('')}</optgroup>
      <optgroup label="Mes">${ALLM.slice().reverse().map(k => `<option value="m:${k}" ${PER === 'm:' + k ? 'selected' : ''}>${esc(mesLab(k))}</option>`).join('')}</optgroup>
    </select></div></div>`;
  document.getElementById('p-rotacion').innerHTML = sel + '<div id="rotBody"></div>';
  document.getElementById('perSel').onchange = e => { PER = e.target.value; drawRotacion(); };
  drawRotacion();
}

function drawRotacion() {
  const { p, test, desde } = perInfo();
  const u = unidadesPeriodo(test);
  const ud = p.mes ? unidadesPeriodo(desde) : u;   // base del stock inicial
  const u12 = unidadesPeriodo(i => R.di[i] > CUTDI - 365);   // ritmo anual, inmune a la temporada
  const cobDe = (st, j) => { const r = Math.max(0, u12[j]) / 12; return r > 0 ? st / r : null; };

  const sku = [];
  for (let j = 0; j < PN.length; j++) {
    const st = PSTK[j] || 0, v = Math.max(0, u[j]), ini = st + Math.max(0, ud[j]);
    if (!ini) continue;
    sku.push({ j, cat: PC[j], st, v, ini, rot: ini > 0 ? v / ini * 100 : 0,
      cob: cobDe(st, j), u12: Math.max(0, u12[j]), val: st * (PCST[j] || 0) });
  }
  const T = sku.reduce((a, o) => ({ st: a.st + o.st, v: a.v + o.v, ini: a.ini + o.ini, val: a.val + o.val }), { st: 0, v: 0, ini: 0, val: 0 });
  const Tini = T.ini, rotT = Tini ? T.v / Tini * 100 : 0;
  let T12 = 0; for (let j = 0; j < PN.length; j++) T12 += Math.max(0, u12[j]);
  const cobT = T12 > 0 ? T.st / (T12 / 12) : null;

  const kpis = `<div class="grid g4">
    ${kpi('Stock actual', nf(T.st) + ' <small>un</small>', `<span>${money(T.val)} a costo${p.mes ? ' · hoy' : ''}</span>`, 'var(--ceruleo)')}
    ${kpi(p.mes ? 'Vendido en el mes' : 'Vendido en el período', nf(Math.round(T.v)) + ' <small>un</small>', `<span>${esc(p.lab.toLowerCase())}</span>`, 'var(--magenta)')}
    ${kpi('Rotación', pct0(rotT), `<span>de un stock inicial de ${nf(Math.round(Tini))} un</span>`, rotT >= 50 ? 'var(--verde)' : 'var(--naranja)')}
    ${kpi('Cobertura', cobT === null ? '—' : nf(cobT, 1) + ' <small>meses</small>', `<span>al ritmo de los últimos 12 meses</span>`, cobT !== null && cobT > 12 ? 'var(--naranja)' : 'var(--violeta)')}
  </div>`;

  /* por categoría */
  const cats = CAT.map((c, ci) => {
    const r = sku.filter(o => o.cat === ci);
    if (!r.length) return null;
    const st = r.reduce((a, o) => a + o.st, 0), v = r.reduce((a, o) => a + o.v, 0),
      val = r.reduce((a, o) => a + o.val, 0), ini = r.reduce((a, o) => a + o.ini, 0);
    let a12 = 0; for (let j = 0; j < PN.length; j++) if (PC[j] === ci) a12 += Math.max(0, u12[j]);
    return { ci, lab: c, st, v, ini, val, sku: r.length, rot: ini ? v / ini * 100 : 0, cob: a12 > 0 ? st / (a12 / 12) : null };
  }).filter(Boolean).sort((a, b) => b.ini - a.ini);

  const graf = `<div class="card"><div class="chead"><div><h2>Rotación sobre el stock inicial</h2>
    <p class="hint">Cada barra es el stock inicial de la categoría${p.mes ? ' al empezar ' + p.lab.toLowerCase() : ''}: la parte sólida se vendió, la clara quedó.</p></div>
    <div class="legend" style="margin-left:auto"><span>color sólido = vendido</span><span><i style="background:#D8DEE6"></i>gris = sigue en stock</span></div></div>
    ${rotBars(cats)}`;

  const tCat = `<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">` +
    tbl([{ t: 'Categoría', l: 1 }, { t: 'SKU' }, { t: 'Stock inicial' }, { t: 'Vendido' }, { t: 'Stock actual' }, { t: 'Rotación' }, { t: 'Cobertura (meses)' }, { t: 'Valor stock' }],
      cats.map(o => [cL(`<span class="dot" style="background:${catColor(o.ci)}"></span>${esc(o.lab)}`),
      cN(nf(o.sku)), cN(nf(Math.round(o.ini))), cN(nf(Math.round(o.v))), cN(nf(o.st)),
      cN(`<span class="chip ${o.rot >= 50 ? 'up' : o.rot >= 25 ? 'nt' : 'dn'}">${pct0(o.rot)}</span>`),
      cN(o.cob === null ? '<span class="mini">—</span>' : nf(o.cob, 1)), cN(money(o.val))]),
      { foot: `<tr class="tot"><td>Total</td><td class="n">${nf(sku.length)}</td><td class="n">${nf(Math.round(Tini))}</td>
        <td class="n">${nf(Math.round(T.v))}</td><td class="n">${nf(T.st)}</td><td class="n">${pct0(rotT)}</td>
        <td class="n">${cobT === null ? '—' : nf(cobT, 1)}</td><td class="n">${money(T.val)}</td></tr>` }) + '</div></div>';

  /* stock que no se mueve: mayor valor con rotación baja */
  const lento = sku.filter(o => o.st > 0 && o.rot < 25).sort((a, b) => b.val - a.val).slice(0, 12);
  const tLento = `<div class="card"><h2>Stock que no rota</h2>
    <p class="hint">SKU con menos de 25% de rotación en el período, por valor inmovilizado</p>` +
    (lento.length ? tbl([{ t: 'Producto', l: 1 }, { t: 'Stock' }, { t: 'Vendido' }, { t: 'Rot.' }, { t: 'Cob. meses' }, { t: 'Valor' }],
      lento.map(o => [cL(`<span class="dot" style="background:${catColor(o.cat)}"></span>${esc(PN[o.j])}`, 'name'),
      cN(nf(o.st)), cN(nf(Math.round(o.v))), cN(`<span class="chip dn">${pct0(o.rot)}</span>`),
      cN(o.cob === null ? '<span class="mini">sin venta</span>' : nf(o.cob, 0)), cN(money(o.val))]))
      : '<p class="empty">Todo el catálogo rota sobre el 25% en el período.</p>') + '</div>';

  const orden = sku.slice().sort((a, b) => b.val - a.val);
  const tSku = `<div class="card"><h2>Rotación por SKU</h2><p class="hint">${esc(p.lab)} · ordenado por valor de stock</p>` +
    tbl([{ t: '#', l: 1 }, { t: 'Producto', l: 1 }, { t: 'Categoría', l: 1 }, { t: 'Stock inicial' }, { t: 'Vendido' }, { t: 'Stock actual' }, { t: 'Rotación' }, { t: 'Cobertura (meses)' }, { t: 'Valor stock' }],
      orden.map((o, ix) => [cL(String(ix + 1), 'n'), cL(esc(PN[o.j]), 'name'),
      cL(`<span class="dot" style="background:${catColor(o.cat)}"></span><span class="mini">${esc(CAT[o.cat])}</span>`),
      cN(nf(Math.round(o.ini))), cN(nf(Math.round(o.v))), cN(nf(o.st)),
      cN(`<span class="chip ${o.rot >= 50 ? 'up' : o.rot >= 25 ? 'nt' : 'dn'}">${pct0(o.rot)}</span>`),
      cN(o.cob === null ? '<span class="mini">—</span>' : nf(o.cob, o.cob >= 10 ? 0 : 1)), cN(money(o.val))])) + '</div>';

  document.getElementById('rotBody').innerHTML = kpis + graf + tCat + `</div>` + tLento + tSku;
}

function rotBars(cats) {
  if (!cats.length) return '<p class="empty">Sin datos en el período.</p>';
  const W = 1000, rowH = 30, gap = 18, lw = 150, padR = 150;
  const iw = W - lw - padR, H = cats.length * (rowH + gap);
  const max = Math.max(...cats.map(o => o.ini), 1);
  let s = '';
  cats.forEach((o, ri) => {
    const y = ri * (rowH + gap), bw = Math.max(2, o.ini / max * iw), vw = o.ini ? bw * (o.v / o.ini) : 0;
    const col = catColor(o.ci);
    s += `<text x="0" y="${y + rowH / 2 + 4}" font-size="11.5" font-weight="600" fill="var(--ink)">${esc(o.lab)}</text>`;
    s += `<rect x="${lw}" y="${y}" width="${bw}" height="${rowH}" rx="4" fill="#D8DEE6">${T(`${o.lab}: ${nf(o.st)} un en stock de un inicial de ${nf(Math.round(o.ini))}`)}</rect>`;
    if (vw > 0) s += `<rect x="${lw}" y="${y}" width="${vw}" height="${rowH}" rx="4" fill="${col}">${T(`${o.lab}: ${nf(Math.round(o.v))} un vendidas · ${pct0(o.rot)} del stock inicial`)}</rect>`;
    if (vw > 52) s += `<text x="${lw + vw - 9}" y="${y + rowH / 2 + 4}" font-size="10.5" font-weight="700" fill="#fff" text-anchor="end" class="n" pointer-events="none">${esc(pct0(o.rot, 0))}</text>`;
    else s += `<text x="${lw + vw + 7}" y="${y + rowH / 2 + 4}" font-size="10.5" font-weight="700" fill="${col}" class="n" pointer-events="none">${esc(pct0(o.rot, 1))}</text>`;
    s += `<text x="${lw + bw + 12}" y="${y + rowH / 2 - 1}" font-size="11.5" font-weight="700" fill="var(--ink)" class="n">${esc(nf(Math.round(o.ini)))} un</text>`;
    s += `<text x="${lw + bw + 12}" y="${y + rowH / 2 + 12}" font-size="9.5" fill="var(--muted)" class="n">${esc(nf(o.st) + ' en stock')}</text>`;
  });
  return SVG(`0 0 ${W} ${H}`, s);
}

/* ============ init ============ */
const TABS = { resumen: renderResumen, ventas: renderVentas, productos: renderProductos, clientes: renderClientes, cierre: renderCierre, sellout: renderSellout, rotacion: renderRotacion };
let TAB = 'resumen';
function renderAll() { applyFilter(); Object.keys(TABS).forEach(t => TABS[t]()); }
function boot() {
  const cl = document.getElementById('cutLabel');
  cl.textContent = 'Datos al ' + nf(CD) + ' de ' + MESL[CM] + ' de ' + CY;
  const fc = document.getElementById('fCanal'), fz = document.getElementById('fZona');
  fc.innerHTML = '<option value="-1">Todos los canales</option>' + CAN.map((c, i) => `<option value="${i}">${esc(c)}</option>`).join('');
  fz.innerHTML = '<option value="-1">Todas las zonas</option>' + ZON.map((c, i) => `<option value="${i}">${esc(c)}</option>`).join('');
  fc.onchange = e => { F.canal = +e.target.value; renderAll(); };
  fz.onchange = e => { F.zona = +e.target.value; renderAll(); };
  const nav = document.getElementById('tabs');
  nav.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    TAB = b.dataset.t;
    [...nav.children].forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + TAB));
    lockFilters(TAB === 'sellout' || TAB === 'rotacion');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  renderAll();
}
/* el sell out viene de Tottus, no de la facturación: los filtros no lo recalculan */
function lockFilters(off) {
  [['fCanal', 'canal'], ['fZona', 'zona']].forEach(([id]) => {
    const el = document.getElementById(id); if (!el) return;
    el.disabled = off;
    el.title = off ? 'Esta vista no se filtra por canal ni zona' : '';
    el.parentElement.classList.toggle('off', off);
  });
}
boot();
